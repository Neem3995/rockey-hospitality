spring.application.name=rockey-hospitality

# Documentation tooling only; the business contract remains exactly 51 operations.
springdoc.paths-to-match=/api/**

spring.datasource.url=${ROCKEY_DB_URL}
spring.datasource.username=${ROCKEY_DB_USERNAME}
spring.datasource.password=${ROCKEY_DB_PASSWORD}

# SQL defines the tables; fail on a mismatch instead of silently rewriting the database.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Persist timestamp values through UTC JDBC handling; API LocalDateTime fields retain server-local form.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

rockey.security.jwt-secret=${ROCKEY_JWT_SECRET_BASE64}
rockey.security.access-token-minutes=15
rockey.security.refresh-token-days=7
rockey.security.refresh-cookie-secure=${ROCKEY_REFRESH_COOKIE_SECURE:false}
rockey.security.refresh-cookie-same-site=${ROCKEY_REFRESH_COOKIE_SAME_SITE:Lax}
rockey.security.allowed-origins=${ROCKEY_CORS_ALLOWED_ORIGINS:http://localhost:5173}

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# One combined scan, five minutes after startup and after each previous scan completes.
rockey.alerts.scan-delay-ms=${ROCKEY_ALERT_SCAN_DELAY_MS:300000}
